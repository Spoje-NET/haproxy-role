---

- name: Retrieve Certbot certificates using local module
  certbot_certificates:
  register: certbot_data

- name: Debug Certbot certificates
  ansible.builtin.debug:
    msg: "{{ certbot_data.certificates }}"

- name: Include cleanup tasks
  ansible.builtin.include_tasks: cleanup.yml

- name: Find certificates missing for configured HAProxy domains
  ansible.builtin.set_fact:
    missing_haproxy_certs: "{{ haproxy_domains | difference(certbot_data.certificates | map(attribute='name') | list) }}"

- name: Debug missing certificates
  ansible.builtin.debug:
    msg: "Missing certificates: {{ missing_haproxy_certs }}"

- name: Ensure certbot email is configured when creating missing certificates
  ansible.builtin.assert:
    that:
      - haproxy_certbot_email | length > 0
    fail_msg: "haproxy_certbot_email (or certbot_admin_email) must be set to create missing certificates."
  when:
    - haproxy_certbot_create_missing | bool
    - missing_haproxy_certs | length > 0

- name: Ensure certbot-haproxy authenticator plugin is installed
  ansible.builtin.package:
    name: ['python3-zope.interface', 'certbot-haproxy']
    state: present
  when:
    - haproxy_certbot_create_missing | bool
    - missing_haproxy_certs | length > 0

- name: Create missing certificates
  ansible.builtin.command: >
    certbot certonly
    --authenticator haproxy-authenticator
    --haproxy-authenticator-haproxy-http-01-port {{ haproxy_certbot_http01_port }}
    --non-interactive --agree-tos
    --email {{ haproxy_certbot_email }}
    --deploy-hook /usr/bin/certbot-haproxy-deploy
    -d {{ item }}
  with_items: "{{ missing_haproxy_certs }}"
  register: certbot_create_result
  changed_when: true
  when:
    - haproxy_certbot_create_missing | bool
    - missing_haproxy_certs | length > 0

- name: Find renewal configs using the standalone authenticator
  ansible.builtin.find:
    paths: /etc/letsencrypt/renewal
    patterns: '*.conf'
    contains: '^authenticator\s*=\s*standalone\s*$'
  register: standalone_renewal_confs

- name: Switch standalone renewal configs to haproxy-authenticator (port 80 is held by HAProxy)
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^authenticator\s*='
    line: 'authenticator = haproxy-authenticator'
  loop: "{{ standalone_renewal_confs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Set HTTP-01 port in migrated renewal configs
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^http01_port\s*='
    line: "http01_port = {{ haproxy_certbot_http01_port }}"
    insertafter: '^authenticator\s*='
  loop: "{{ standalone_renewal_confs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find certificates to renew
  ansible.builtin.set_fact:
    certs_to_renew: >-
      {{
        certbot_data.certificates
        | selectattr('days_until_expiration', 'lt', 30)
        | map(attribute='name')
        | list
      }}

- name: Debug certificates to renew
  ansible.builtin.debug:
    msg: "Certificates to renew: {{ certs_to_renew }}"

- name: Renew certificates close to expiration
  ansible.builtin.command: >
    certbot renew --cert-name {{ item }}
    --non-interactive --quiet --no-random-sleep-on-renew --deploy-hook /usr/bin/certbot-haproxy-deploy
  with_items: "{{ certs_to_renew }}"
  register: certbot_renew_result
  changed_when: true
  ignore_errors: true
  when: certs_to_renew | length > 0

- name: Debug Certbot Renew Output
  ansible.builtin.debug:
    msg: "{{ certbot_renew_result.stdout_lines | default([]) + certbot_renew_result.stderr_lines | default([]) }}"
  when: certs_to_renew | length > 0

- name: Check if FQDN certificate exists for fallback
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ ansible_fqdn }}/fullchain.pem"
  register: fqdn_cert_file_status
  changed_when: false
  check_mode: false

- name: Create fallback certificate for HAProxy
  ansible.builtin.command: >
    cat /etc/letsencrypt/live/{{ ansible_fqdn }}/fullchain.pem
    /etc/letsencrypt/live/{{ ansible_fqdn }}/privkey.pem
    > /etc/haproxy/ssl/__fallback.pem
  when: fqdn_cert_file_status.stat.exists

- name: Set permissions for fallback certificate
  ansible.builtin.file:
    path: /etc/haproxy/ssl/__fallback.pem
    owner: haproxy
    group: haproxy
    mode: '0600'
  when: fqdn_cert_file_status.stat.exists
