- name: Ensure HAProxy is enabled (so init script will start it on Debian).
  ansible.builtin.lineinfile:
    dest: /etc/default/haproxy
    regexp: "^ENABLED.+$"
    line: "ENABLED=1"
    state: present
  when: ansible_os_family == 'Debian'

- name: Get HAProxy version.
  ansible.builtin.command: haproxy -v
  register: haproxy_version_result
  changed_when: false
  check_mode: false

- name: Set HAProxy version.
  ansible.builtin.set_fact:
    haproxy_version: "{{ haproxy_version_result.stdout | regex_search('HAProxy version ([0-9.]+)', '\\1') | first }}"

- name: Copy configuration in place for HAProxy {{ haproxy_version }}
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
  notify: Restart haproxy

- name: Deploy fixed certbot-haproxy-deploy script
  ansible.builtin.copy:
    src: certbot-haproxy-deploy.py
    dest: /usr/bin/certbot-haproxy-deploy
    mode: '0755'
    owner: root
    group: root

- name: SystemD Letsencrypt Timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/letsencrypt.timer"
    mode: '0744'
    content: |
        [Unit]
        Description=Run Let's Encrypt every 12 hours
        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=12h
        Unit=letsencrypt.service
        [Install]
        WantedBy=timers.target

- name: SystemD Letsencrypt Service
  ansible.builtin.copy:
    dest: "/etc/systemd/system/letsencrypt.service"
    mode: '0744'
    content: |
        [Unit]
        Description=Renew Let's Encrypt Certificates
        [Service]
        Type=simple
        ExecStart=/usr/bin/certbot renew -q --deploy-hook /usr/bin/certbot-haproxy-deploy --post-hook 'systemctl reload haproxy'
  notify: Reload systemd

- name: Enable and start letsencrypt timer
  ansible.builtin.systemd:
    name: letsencrypt.timer
    enabled: true
    state: started
    daemon_reload: false

# letsencrypt.timer (above) is the single source of truth for renewals on
# haproxy hosts: it runs certbot's own deploy-hook (cert install) and a
# post-hook (haproxy reload). The distro-shipped certbot.timer and any
# ad-hoc root crontab entry duplicate this without the reload step, so they
# are disabled to avoid certs being renewed but never picked up by haproxy.
- name: Disable distro-shipped certbot.timer (superseded by letsencrypt.timer)
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: false
    state: stopped
  failed_when: false

- name: Remove any ad-hoc root crontab certbot renewal entry
  ansible.builtin.cron:
    name: "Certbot automatic renewal"
    state: absent

# Index page - serve list of all backends
- name: Create webroot directory for index page
  ansible.builtin.file:
    path: /var/www/haproxy
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Generate index.html from template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/haproxy/index.html
    mode: '0644'

- name: Deploy Apache VirtualHost configuration for index page
  ansible.builtin.copy:
    dest: /etc/apache2/sites-available/haproxy-index.conf
    mode: '0644'
    content: |
      <VirtualHost *:8080>
          ServerName haproxy.spojenet.cz
          ServerAdmin admin@vitexsoftware.com
          DocumentRoot /var/www/haproxy
          
          <Directory /var/www/haproxy>
              AllowOverride None
              Require all granted
              DirectoryIndex index.html
          </Directory>
          
          ErrorLog ${APACHE_LOG_DIR}/haproxy-index-error.log
          CustomLog ${APACHE_LOG_DIR}/haproxy-index-access.log combined
      </VirtualHost>

- name: Enable Apache module for VirtualHosts
  ansible.builtin.command: a2enmod mpm_prefork
  changed_when: false

- name: Ensure Apache listens on port 8080
  ansible.builtin.lineinfile:
    path: /etc/apache2/ports.conf
    regexp: "^Listen 8080"
    line: "Listen 8080"
    insertafter: "^Listen 80"
  notify: Restart Apache

- name: Enable HAProxy index site
  ansible.builtin.command: a2ensite haproxy-index
  changed_when: false
  notify: Restart Apache

- name: Disable default site (conflicts on port 8080)
  ansible.builtin.command: a2dissite 000-default
  changed_when: false
  notify: Restart Apache
